  <style>
      * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
    :root {
  --bg-main: #060913;
  --surface: rgba(17, 23, 38, 0.65);
  --border-glow: rgba(223, 168, 55, 0.2);
  --gold: #dfa837;
  --gold-hover: #f5c463;
  --text-white: #f8fafc;
  --text-gray: #94a3b8;
  --font-system: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
}
body {
  background-color: var(--bg-main);
  color: var(--text-white);
  font-family: var(--font-system);
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
  zoom:75%;
}

/* Header Ejecutivo */
.header_1 {
  background-color: transparent;
  color: var(--text-white);
  padding: 40px 20px;
  text-align: center;
}

.header_1 h1 {
  margin: 0;
  font-size: 2.2em;
  font-weight: 800;
  letter-spacing: -0.5px;
}

/* Buscadores Avanzados (Glassmorphism) */
.buscadores {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
  margin: 20px auto;
  max-width: 800px;
}

.buscadores input {
  width: 280px;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  color: var(--text-white);
  font-size: 0.95rem;
  outline: none;
  backdrop-filter: blur(8px);
  transition: all 0.25s ease;
}

.buscadores input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 12px rgba(223, 168, 55, 0.15);
}

.buscadores input::placeholder {
  color: var(--text-gray);
}

/* Contenedor Flex Grid */
.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 30px 20px;
  flex-wrap: wrap;
  max-width: 1200px;
  margin: 0 auto;
}

/* Tarjetas Élite con Brillo Perimetral */
.card {
  background: linear-gradient(135deg, #111625 0%, #0a0d18 100%);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 12px;
  color: var(--text-white);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  margin: 0; /* Controlado ahora por el gap del container */
  padding: 24px;
  width: 320px;
  position: relative;
  overflow: hidden;
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.3s ease, box-shadow 0.3s ease;
}

.card:hover {
  transform: translateY(-6px);
  border-color: var(--border-glow);
  box-shadow: 0 12px 24px rgba(223, 168, 55, 0.08), 0 4px 12px rgba(0, 0, 0, 0.4);
}

/* Línea de acento dorado superior en la tarjeta */
.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: 0.7;
}

.card h2 {
  margin-top: 0;
  margin-bottom: 12px;
  color: var(--gold);
  font-size: 1.3em;
  font-weight: 700;
  letter-spacing: -0.2px;
}

.card p {
  margin: 8px 0;
  font-size: 0.95em;
  color: var(--text-gray);
  line-height: 1.5;
}

/* ==========================================================================
   Media Query: Optimización Responsiva Celulares
   ========================================================================== */
@media (max-width: 600px) {
  body {
    font-size: 14px;
  }
  
  .header_1 {
    padding: 25px 15px;
  }
  
  .header_1 h1 {
    font-size: 1.6em;
  }
  
  .buscadores {
    flex-direction: column;
    align-items: center;
    margin: 10px 0;
    gap: 12px;
    width: 100%;
  }
  
  .buscadores input {
    width: 100%;
    max-width: 90%;
    padding: 12px;
  }
  
  .container {
    padding: 10px;
    gap: 15px;
  }
  
  .card {
    width: 100%;
    max-width: 90%;
    padding: 20px;
  }
  
  .card h2 {
    font-size: 1.2em;
  }
}

      }
    ];

    const contenedor = document.getElementById("directorio");

    function mostrarDirectorio(lista) {
      contenedor.innerHTML = "";
      lista.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <h2>${item.area}</h2>
          <p><strong>Titular:</strong> ${item.titular}</p>
          <p><strong>Contacto:</strong> ${item.contacto || "No disponible"}</p>
          <p><strong>Teléfono:</strong> ${item.telefono}</p>
          <p><strong>Dirección:</strong> ${item.direccion}</p>
        `;
        contenedor.appendChild(card);
      });
    }

    mostrarDirectorio(datos);

    // 🔍 Filtros por área y persona
    function filtrar() {
      const textoArea = document.getElementById("searchArea").value.toLowerCase();
      const textoPersona = document.getElementById("searchPersona").value.toLowerCase();

      const filtrados = datos.filter(item =>
        item.area.toLowerCase().includes(textoArea) &&
        item.titular.toLowerCase().includes(textoPersona)
      );
      mostrarDirectorio(filtrados);
    }

    document.getElementById("searchArea").addEventListener("input", filtrar);
    document.getElementById("searchPersona").addEventListener("input", filtrar);
  </script>

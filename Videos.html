        :root {

      .blur-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    z-index: 1;
    opacity: 0.35;
    pointer-events: none; /* Evita que bloquee clics en la tarjeta */
    will-change: transform; /* Optimiza el rendimiento en el navegador */
}

/* --- ORBE 1 (Esquina superior derecha) --- */
.orb-1 {
    width: 450px;
    height: 450px;
    background: var(--accent-glow);
    top: -10%;
    right: 10%;
    /* Animación fluida de 18 segundos que va y regresa */
    animation: floatOrb1 18s infinite alternate ease-in-out;
}

/* --- ORBE 2 (Esquina inferior izquierda) --- */
.orb-2 {
    width: 350px;
    height: 350px;
    background: #4f46e5;
    bottom: -5%;
    left: 10%;
    /* Tiempo diferente (24s) para que no se muevan al unísono */
    animation: floatOrb2 24s infinite alternate ease-in-out;
}

/* --- Movimiento Orgánico para el Orbe 1 --- */
@keyframes floatOrb1 {
    0% {
        transform: translate(0, 0) scale(1);
    }
    33% {
        transform: translate(-80px, 60px) scale(1.15);
    }
    66% {
        transform: translate(30px, 120px) scale(0.9);
    }
    100% {
        transform: translate(-40px, 40px) scale(1.05);
    }
}

/* --- Movimiento Orgánico para el Orbe 2 --- */
@keyframes floatOrb2 {
    0% {
        transform: translate(0, 0) scale(1);
    }
    40% {
        transform: translate(90px, -70px) scale(0.85);
    }
    70% {
        transform: translate(-50px, -130px) scale(1.2);
    }
    100% {
        transform: translate(60px, -40px) scale(1);
    }
}
 .top-bar {  
  background: #f1c40f; 
  color: #111; 
  font-weight: 600; 
  font-size: 14px; 
  position: fixed; 
  top: 0; 
  left: 0; 
  width: 100%;
  height: 65px; 
  z-index: 1000; 
  
  /* Método definitivo para centrar vertical y horizontalmente */
  display: flex;
  justify-content: center; /* Centrado horizontal */
  align-items: center;     /* Centrado vertical */
  box-sizing: border-box;
}
      
      
        /* --- INTERFAZ BASE --- */
        .header-app {
            padding: 30px 20px 10px;
            text-align: center;
            max-width: 1400px;
            margin: 0 auto;
        }
        .header-app h1 { margin: 0 0 10px; font-size: 2rem; letter-spacing: 1px; }
        .header-app span { color: var(--accent); }

        /* Controles de Búsqueda y Filtros */
        .controls-bar {
            max-width: 1400px;
            margin: 0 auto 30px;
            padding: 0 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
        }
        .search-box {
            background: var(--bg-card);
            border: 1px solid #334155;
            padding: 10px 15px;
            border-radius: 8px;
            color: var(--text);
            width: 100%;
            max-width: 350px;
            outline: none;
        }
        .search-box:focus { border-color: var(--accent); }
        .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-btn {
            background: var(--bg-card);
            border: 1px solid #334155;
            color: var(--text);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
            font-weight: 600;
        }

        /* Layout de Distribución */
        .main-layout {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 50px;
        }
        .player-section { grid-column: span 8; }
        .sidebar-section { grid-column: span 4; }

        @media (max-width: 992px) {
            .player-section, .sidebar-section { grid-column: span 12; width: -webkit-fill-available;}
        }

        /* Contenedor del Reproductor Principal */
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        .video-container video {
            position: absolute;
            top:0; left:0; width:100%; height:100%;
        }

        /* Botonera de interacción */
        .player-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
              flex-wrap: wrap;
        }
        .action-btn {
            background: #334155;
            color: var(--text);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        .action-btn:hover { background: #475569; }

        /* Lista Lateral de Videos (Módulos de selección) */
        .playlist-container {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 15px;
            max-height: 600px;
            overflow-y: auto;
        }
        .playlist-item {
            display: flex;
            gap: 12px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background 0.2s;
            border: 1px solid transparent;
        }
        .playlist-item:hover { background: #2d3748; }
        .playlist-item.playing {
            background: #1e3a8a;
            border-color: var(--accent);
        }
        .thumb-mock {
            width: 100px;
            height: 56px;
            background: #475569;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            flex-shrink: 0;
        }
        .item-info { display: flex; flex-direction: column; justify-content: center; }
        .item-info h4 { margin: 0 0 4px; font-size: 0.95rem; }
        .item-info p { margin: 0; font-size: 0.8rem; color: var(--text-muted); }
      /* Optimización de la barra de desplazamiento (Scrollbar) */
.playlist-container::-webkit-scrollbar {
    width: 6px;
}
.playlist-container::-webkit-scrollbar-track {
    background: transparent;
}
.playlist-container::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
}
.playlist-container::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.25);
}
      /* Contenedor de la miniatura con posicionamiento relativo */
.thumb-wrapper {
    position: relative;
    width: 100px;
    height: 56px;
    background-color: #475569;
    border-radius: 4px;
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
    overflow: hidden;
}

/* Capa oscura decorativa de fondo */
.thumb-wrapper::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.4);
    transition: background 0.3s ease;
}

/* El Triángulo de Reproducción Premium (Dorado con Glow) */
.premium-play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(1);
    width: 0;
    height: 0;
    /* Geometría del triángulo en CSS */
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-left: 16px solid #fbbf24; /* Amarillo Dorado Premium */
    filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.6));
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 2;
}

/* Efectos visuales cuando el usuario pasa el ratón por encima (Hover) */
.playlist-item:hover .premium-play-btn {
    border-left-color: #f59e0b; /* Dorado más intenso */
    transform: translate(-50%, -50%) scale(1.25); /* Se agranda dinámicamente */
    filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.9));
}

.playlist-item:hover .thumb-wrapper::before {
    background: rgba(15, 23, 42, 0.1); /* Aclara la imagen al pasar el cursor */
}

/* Ocultar el triángulo si el video ya se está reproduciendo actualmente */
.playlist-item.playing .premium-play-btn {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.5);
}

      filteredVideos.forEach(video => {
        const item = document.createElement('div');
        item.className = `playlist-item ${video.id === currentActiveId ? 'playing' : ''}`;
        
        // Renderizado con la estructura del triángulo premium flotante
        item.innerHTML = `
            <div class="thumb-wrapper" style="background-image: url('${video.poster}');">
                <div class="premium-play-btn"></div>
            </div>
            <div class="item-info">
                <h4>${video.title}</h4>
                <p>${video.category.toUpperCase()}</p>
            </div>
        `;
        item.onclick = () => loadVideo(video.id);
        playlistElement.appendChild(item);
    });

}

function loadVideo(id, savedTime = 0) {
    currentActiveId = id;
    const targetVideo = videoData.find(v => v.id === id);
    
    if (targetVideo) {
        videoElement.src = targetVideo.src;
        videoElement.poster = targetVideo.poster; // Asigna miniatura al reproductor principal
        document.getElementById('currentTitle').innerText = targetVideo.title;
        document.getElementById('currentDesc').innerText = targetVideo.desc;
        
        // MEMORIA EXTRA: Guarda el último video seleccionado en el navegador
        localStorage.setItem('corporate_last_video', id);
        
        const items = playlistElement.querySelectorAll('.playlist-item');
        videoData.forEach((video, index) => {
            const currentItem = items[index];
            if (currentItem) {
                currentItem.classList.toggle('playing', video.id === id);
            }
        });
        
        // Si venía con un tiempo guardado, lo posiciona ahí
        if(savedTime > 0) {
            videoElement.currentTime = savedTime;
        }

        videoElement.play().catch(e => console.log("Autoplay bloqueado hasta interacción."));
    }
}

// MEMORIA EXTRA: Guarda el segundo exacto en el que va el usuario cada vez que avanza el video
videoElement.ontimeupdate = function() {
    localStorage.setItem('corporate_video_time', videoElement.currentTime);
};

/* --- CONTROLES EXTRA: SALTO MANUAL (NEXT / PREV) --- */
function nextVideo() {
    let nextId = (currentActiveId + 1) % videoData.length;
    loadVideo(nextId);
}

function prevVideo() {
    let prevId = (currentActiveId - 1 + videoData.length) % videoData.length;
    loadVideo(prevId);
}

videoElement.onended = function() {
    nextVideo();
};

// Modificadores de Filtros y Buscador
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.onclick = (e) => {
        document.querySelector('.filter-btn.active').classList.remove('active');
        e.target.classList.add('active');
        currentFilter = e.target.getAttribute('data-category');
        renderPlaylist();
    };
});

document.getElementById('searchBar').oninput = (e) => {
    currentSearchQuery = e.target.value;
    renderPlaylist();
};

theaterBtn.onclick = () => {
    document.body.classList.toggle('theater-mode');
    theaterBtn.innerText = document.body.classList.contains('theater-mode') ? "🎯 Modo Normal" : "🎭 Modo Teatro";
};

// ARRANQUE INTELIGENTE CON MEMORIA
window.onload = () => {
    renderPlaylist();
    
    // Intenta recuperar el estado de la última sesión del usuario
    const savedVideo = localStorage.getItem('corporate_last_video');
    const savedTime = localStorage.getItem('corporate_video_time');
    
    if (savedVideo !== null) {
        loadVideo(parseInt(savedVideo), savedTime ? parseFloat(savedTime) : 0);
    } else {
        loadVideo(0); // Primera vez por defecto
    }
};

    </script>
</body>

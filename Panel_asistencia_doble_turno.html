    <script>
    // --- CONFIGURACIÓN ADMINISTRATIVA Y EMPLEADOS ---
    const CLAVE_EXCEL = "admin123";   // Contraseña para exportar el reporte
    const CLAVE_BORRAR = "super789";  // Contraseña para vaciar el historial

    // Diccionario para vincular cada número de PIN con el nombre de un empleado
    const BASE_EMPLEADOS = {
        "1234": "Carlos Mendoza",
        "5678": "Ana Gómez",
        "9012": "Luis Martínez",
        "4321": "Sofía Rodriguez"
    };

    // Iniciar reloj e historial automáticamente al cargar el documento
    document.addEventListener('DOMContentLoaded', () => {
        mostrarHistorial();
        actualizarReloj();
        setInterval(actualizarReloj, 1000);
    });

    // --- FUNCIÓN: RELOJ DIGITAL ---
    function actualizarReloj() {
        const ahora = new Date();
        
        // Formatear Hora (HH:MM:SS)
        document.getElementById('live-clock').textContent = ahora.toLocaleTimeString([], {
            hour: '2-digit', 
            minute: '2-digit', 
            second: '2-digit'
        });

        // Formatear Fecha en texto largo
        document.getElementById('live-date').textContent = ahora.toLocaleDateString('es-ES', {
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric'
        });
    }

    // Función auxiliar para buscar el nombre asignado a un PIN
    function obtenerNombreEmpleado(pin) {
        return BASE_EMPLEADOS[pin] || "Empleado Desconocido";
    }

    // --- FUNCIÓN PRINCIPAL DE FICHAJE CON FILTROS ANTI-DUPLICADOS ---
    function fichar(accion) {
        const pinElement = document.getElementById('pin');
        const pinValue = pinElement.value.trim();

        // Validar longitud mínima del PIN
        if (!pinValue || pinValue.length < 4) {
            alert('Por favor, ingrese un PIN válido (mínimo 4 dígitos).');
            return;
        }

        const ahora = new Date();
        const fechaHoy = ahora.toLocaleDateString();
        const horaActual = ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
        const nombreEmpleado = obtenerNombreEmpleado(pinValue);

        let historial = JSON.parse(localStorage.getItem('asistencia_v2')) || [];
        
        // Buscar si ya existe una fila de hoy para este PIN específico
        let registroIndex = historial.findIndex(reg => reg.fecha === fechaHoy && reg.pin === pinValue);

        // --- LÓGICA TURNO REGULAR ---
        if (accion === 'entrada_regular') {
            // Validación Anti-Duplicado
            if (registroIndex !== -1 && historial[registroIndex].entReg) {
                alert(`Error: ${nombreEmpleado} ya registró su ENTRADA regular hoy a las ${historial[registroIndex].entReg}.`);
                pinElement.value = '';
                return;
            }

            if (registroIndex !== -1) {
                historial[registroIndex].entReg = horaActual;
            } else {
                historial.unshift({
                    fecha: fechaHoy, pin: pinValue, empleado: nombreEmpleado,
                    entReg: horaActual, salReg: "", entDob: "", salDob: ""
                });
            }
        } 
        else if (accion === 'salida_regular') {
            // Validación Anti-Duplicado
            if (registroIndex !== -1 && historial[registroIndex].salReg) {
                alert(`Error: ${nombreEmpleado} ya registró su SALIDA regular hoy a las ${historial[registroIndex].salReg}.`);
                pinElement.value = '';
                return;
            }

            if (registroIndex !== -1 && historial[registroIndex].entReg) {
                historial[registroIndex].salReg = horaActual;
            } else {
                if (!confirm(`${nombreEmpleado} no tiene marca de entrada hoy. ¿Registrar salida de todos modos?`)) {
                    pinElement.value = '';
                    return;
                }
                historial.unshift({ fecha: fechaHoy, pin: pinValue, empleado: nombreEmpleado, entReg: "", salReg: horaActual, entDob: "", salDob: "" });
            }
        } 
        // --- LÓGICA DOBLE TURNO ---
        else if (accion === 'entrada_doble') {
            // Validación Anti-Duplicado
            if (registroIndex !== -1 && historial[registroIndex].entDob) {
                alert(`Error: ${nombreEmpleado} ya registró su ENTRADA DOBLE hoy a las ${historial[registroIndex].entDob}.`);
                pinElement.value = '';
                return;
            }

            if (registroIndex !== -1) {
                historial[registroIndex].entDob = horaActual;
            } else {
                historial.unshift({ fecha: fechaHoy, pin: pinValue, empleado: nombreEmpleado, entReg: "", salReg: "", entDob: horaActual, salDob: "" });
            }
        } 
        else if (accion === 'salida_doble') {
            // Validación Anti-Duplicado
            if (registroIndex !== -1 && historial[registroIndex].salDob) {
                alert(`Error: ${nombreEmpleado} ya registró su SALIDA DOBLE hoy a las ${historial[registroIndex].salDob}.`);
                pinElement.value = '';
                return;
            }

            if (registroIndex !== -1 && historial[registroIndex].entDob) {
                historial[registroIndex].salDob = horaActual;
            } else {
                if (!confirm(`${nombreEmpleado} no tiene marca de entrada doble hoy. ¿Registrar salida doble de todos modos?`)) {
                    pinElement.value = '';
                    return;
                }
                historial.unshift({ fecha: fechaHoy, pin: pinValue, empleado: nombreEmpleado, entReg: "", salReg: "", entDob: "", salDob: horaActual });
            }
        }

        // Guardar la información en el LocalStorage del navegador
        localStorage.setItem('asistencia_v2', JSON.stringify(historial));
        
        // Limpiar la casilla para permitir el siguiente fichaje
        pinElement.value = '';
        
        // Renderizar la actualización en la tabla de inmediato
        mostrarHistorial();
    }

    // Función para pintar las filas y columnas en la tabla HTML
    function mostrarHistorial() {
        const tbody = document.getElementById('log-table-body');
        const historial = JSON.parse(localStorage.getItem('asistencia_v2')) || [];

        if (historial.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="empty-message">No hay turnos registrados en este equipo.</td></tr>`;
            return;
        }

        tbody.innerHTML = historial.map(reg => `
            <tr>
                <td style="color: #64748b;">${reg.fecha}</td>
                <td style="font-weight: bold; letter-spacing: 1px; color: #0f172a;">${reg.pin}</td>
                <td class="employee-text">${reg.empleado}</td>
                <td class="time-text" style="color: var(--success);">${reg.entReg || '<span class="empty-dash">—</span>'}</td>
                <td class="time-text" style="color: var(--danger);">${reg.salReg || '<span class="empty-dash">—</span>'}</td>
                <td class="time-text" style="color: var(--primary);">${reg.entDob || '<span class="empty-dash">—</span>'}</td>
                <td class="time-text" style="color: var(--warning);">${reg.salDob || '<span class="empty-dash">—</span>'}</td>
            </tr>
        `).join('');
    }

    // Función protegida para exportar un archivo CSV compatible con Excel
    function exportarExcelCSV() {
        const password = prompt("Ingrese la contraseña administrativa para descargar el reporte:");
        
        if (password === null) return; 
        if (password !== CLAVE_EXCEL) {
            alert("Contraseña incorrecta. Acceso denegado.");
            return;
        }

        const historial = JSON.parse(localStorage.getItem('asistencia_v2')) || [];
        if (historial.length === 0) {
            alert("No existen registros almacenados para exportar.");
            return;
        }

        // Incorporación del BOM UTF-8 para compatibilidad total de caracteres en Excel
        let csvContenido = "\uFEFF"; 
        csvContenido += "Fecha,PIN,Empleado,Entrada Regular,Salida Regular,Entrada Doble,Salida Doble\n";

        historial.forEach(reg => {
            csvContenido += `"${reg.fecha}","${reg.pin}","${reg.empleado}","${reg.entReg || ''}","${reg.salReg || ''}","${reg.entDob || ''}","${reg.salDob || ''}"\n`;
        });

        const blob = new Blob([csvContenido], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        
        link.setAttribute("href", url);
        link.setAttribute("download", `Reporte_Asistencia_${new Date().toISOString().split('T')[0]}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Función protegida para vaciar la base de datos local
    function limpiarHistorial() {
        const password = prompt("ADVERTENCIA: Se eliminará permanentemente todo el historial del dispositivo.\nIngrese la contraseña de seguridad:");
        
        if (password === null) return; 
        if (password !== CLAVE_BORRAR) {
            alert("Contraseña de borrado incorrecta. Acción cancelada.");
            return;
        }

        if (confirm('¿Está completamente seguro de vaciar la tabla de marcas locales?')) {
            localStorage.removeItem('asistencia_v2');
            mostrarHistorial();
        }
    }
</script>

<body>

    <div class="container">
        <div class="header">
            <span class="badge-premium">Servicio ELEMSEGPRIV</span>
            <h1>Solicitud de Reserva y Cotización</h1>
            <p>Servicios de Elemenxium de Seguridad Privada</p>
        </div>
<form action="https://formspree.io/f/xkjoyalg" method="POST" onsubmit="alert('Solicitud ELEMSEGPRIV enviada con éxito. Un asesor élite lo contactará en breve.');">
    
    <div class="form-group">
        <label for="nombre-razon">Nombre Completo / Razón Social</label>
        <input type="text" id="nombre-razon" name="nombre_razon_social" required placeholder="Ej. Juan Pérez o Empresa S.A.">
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label for="correo">Correo Electrónico Corporativo</label>
            <input type="email" id="correo" name="correo" required placeholder="ejemplo@corporativo.com">
        </div>
        <div class="form-group">
            <label for="telefono">Teléfono de Contacto (Directo / WhatsApp)</label>
            <input type="tel" id="telefono" name="telefono" required placeholder="Ej. +52 55 1234 5678">
        </div>
    </div>

    <div class="form-group">
        <label for="servicio-seguridad">Tipo de Servicio de Seguridad Requerido</label>
        <select id="servicio-seguridad" name="servicio_seguridad" required>
            <option value="" disabled selected>Seleccione un servicio empresarial...</option>
            <option value="vigilancia-intramuros">Vigilancia Física Intramuros (Guardias de Seguridad)</option>
            <option value="control-accesos">Sistemas de Control de Accesos y Recepción Comercial</option>
            <option value="patrullaje-perimetral">Patrullaje y Monitoreo Perimetral</option>
            <option value="seguridad-electronica">CCTV, Alarmas y Seguridad Electrónica</option>
            <option value="analisis-vulnerabilidad">Auditoría de Seguridad y Análisis de Vulnerabilidades</option>
            <option value="prevencion-perdidas">Prevención de Pérdidas y Control de Mermas</option>
            <option value="otros">Otros</option>
        </select>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label for="fecha-inicio">Fecha de Inicio del Servicio</label>
            <input type="date" id="fecha-inicio" name="fecha_inicio" required>
        </div>
        <div class="form-group">
            <label for="duracion-servicio">Modalidad de Contratación / Duración del Servicio</label>
            <select id="duracion-servicio" name="duracion_servicio" required>
                <option value="" disabled selected>Seleccione el periodo de cobertura...</option>
                <option value="eventual">Servicio Eventual / Por Evento (Días específicos)</option>
                <option value="temporal">Esquema Temporal / Por Proyecto (Meses)</option>
                <option value="permanente-fijo">Contrato Anual / Servicio Fijo (Largo Plazo)</option>
                <option value="24-7">Esquema de Continuidad Operativa (24/7 permanente)</option>
                <option value="otros">Otros</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="detalles">Detalles Adicionales y Requerimientos Específicos (Confidencial)</label>
        <textarea id="detalles" name="detalles_adicionales" rows="4" placeholder="Describa brevemente el nivel de riesgo, ubicación de cobertura o especificaciones tácticas requeridas..."></textarea>
    </div>

    <button type="submit" class="btn-submit">Reservar Servicio Élite</button>
</form>


        <p class="footer-note">Toda la información proporcionada está protegida bajo estrictos acuerdos de confidencialidad y secreto profesional.</p>
    </div>

    <style>
        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #d97706;
            --accent-hover: #b45309;
            --text: #f8fafc;
            --bg: #020617;
            --card-bg: #0f172a;
            --input-bg: #1e293b;
            --border: #334155;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
          zoom:75%;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 2rem;
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header p {
            color: #94a3b8;
            margin-top: 5px;
            font-size: 0.95rem;
        }

        .badge-premium {
            display: inline-block;
            background-color: var(--accent);
            color: var(--primary);
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.2);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .btn-submit {
            display: block;
            width: 100%;
            background-color: var(--accent);
            color: var(--primary);
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 30px;
            letter-spacing: 0.5px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
            color: #ffffff;
        }

        .footer-note {
            text-align: center;
            margin-top: 30px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>

.job-row:hover .btn-row-action {
    background: var(--text-white);

/* Modales */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(5, 8, 15, 0.8);

.modal-content {

            <div class="job-card-body" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1-fraction)); gap: 1.5rem; margin-bottom: 1.5rem; color: #cbd5e1; font-size: 0.9rem;">

                    <h4 style="color: #ffffff; font-size: 1rem; margin-top: 0; border-bottom: 1px solid #334155; padding-bottom: 0.5rem;"><i class="fas fa-user-check" style="color: #fbbf24; margin-right: 0.5rem;"></i>Requisitos</h4>

                    <h4 style="color: #ffffff; font-size: 1rem; margin-top: 0; border-bottom: 1px solid #334155; padding-bottom: 0.5rem;"><i class="fas fa-tasks" style="color: #fbbf24; margin-right: 0.5rem;"></i>Funciones Principales</h4>

            <div class="job-card-footer" style="border-top: 1px solid #1e293b; padding-top: 1rem; text-align: right;">
                <button class="btn-action-apply" onclick="openApplyModal(${job.id}, '${job.title}', '${schemaLabel}')" style="background: linear-gradient(135deg, #d97706 0%, #b45309 100%); color: #ffffff; border: none; padding: 0.6rem 1.5rem; border-radius: 4px; font-weight: 600; cursor: pointer; transition: all 0.3s ease;">
                    Postularme a esta Vacante <i class="fas fa-chevron-right" style="margin-left: 0.5rem; font-size: 0.8rem;"></i>
                </button>
            </div>
        `;
        jobsListContainer.appendChild(jobCard);
    });
}

// Lógica de filtrado concurrente (Entrada de texto + Dropdown de turno)
function filterJobs() {
    const searchText = searchInput.value.toLowerCase().trim();
    const selectedSchema = schemaFilter.value;

    const filtered = jobsData.filter(job => {
        const matchesSearch = job.title.toLowerCase().includes(searchText) || 
                              job.requirements.some(r => r.toLowerCase().includes(searchText)) ||
                              job.functions.some(f => f.toLowerCase().includes(searchText));
                              
        const matchesSchema = selectedSchema === "" || job.schema === selectedSchema;

        return matchesSearch && matchesSchema;
    });

    renderJobs(filtered);
}

// Controladores del Modal de Postulación Premium
// Controladores del Modal de Postulación Premium
function openApplyModal(jobId, jobTitle, schemaLabel) {
    const modal = document.getElementById('modal-postular');
    const modalTitle = document.getElementById('modal-title');
    const modalSubtitle = document.getElementById('modal-subtitle');
    const form = document.getElementById('apply-form');
    
    // Inyección dinámica de campos ocultos para registrar los datos del puesto en Formspree
    let hiddenJobInput = document.getElementById('hidden-job-title');
    let hiddenSchemaInput = document.getElementById('hidden-job-schema');
    
    if (!hiddenJobInput) {
        hiddenJobInput = document.createElement('input');
        hiddenJobInput.type = 'hidden';
        hiddenJobInput.id = 'hidden-job-title';
        hiddenJobInput.name = 'Vacante de Interés';
        form.appendChild(hiddenJobInput);
    }
    if (!hiddenSchemaInput) {
        hiddenSchemaInput = document.createElement('input');
        hiddenSchemaInput.type = 'hidden';
        hiddenSchemaInput.id = 'hidden-job-schema';
        hiddenSchemaInput.name = 'Esquema de Turno';
        form.appendChild(hiddenSchemaInput);
    }
    
    // Asignar los valores de la vacante seleccionada a los inputs ocultos
    hiddenJobInput.value = jobTitle;
    hiddenSchemaInput.value = schemaLabel;

    // Actualización de la identidad visual del Modal
    modalTitle.innerHTML = `Postulación para: <span class="gold-text" style="color: #fbbf24;">${jobTitle}</span>`;
    modalSubtitle.textContent = `Modalidad operativa seleccionada: ${schemaLabel}`;
    
    // Mostrar modal con flexbox para centrado perfecto y bloquear scroll del fondo
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden'; 
}

function closeModal() {
    const modal = document.getElementById('modal-postular');
    modal.style.display = 'none';
    document.body.style.overflow = 'auto'; // Restaurar el desplazamiento normal de la página
    document.getElementById('apply-form').reset(); // Limpiar campos del formulario
}

// Envío controlado asíncronamente (AJAX) hacia Formspree
function submitApplication(event) {
    event.preventDefault();
    const form = event.target;
    const submitBtn = form.querySelector('button[type="submit"]') || form.querySelector('button');
    
    // Cambiar estado del botón para feedback visual del usuario
    const originalBtnText = submitBtn ? submitBtn.textContent : "Enviar";
    if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = "Procesando postulación corporativa...";
    }

    // Petición AJAX nativa a Formspree
    fetch(form.action, {
        method: form.method,
        body: new FormData(form),
        headers: {
            'Accept': 'application/json'
        }
    }).then(response => {
        if (response.ok) {
            alert("¡Postulación recibida con éxito! Nuestro departamento de Capital Humano de ELEMSEGPRIV se comunicará contigo a la brevedad para agendar tu entrevista.");
            closeModal();
        } else {
            response.json().then(data => {
                if (Object.prototype.hasOwnProperty.call(data, 'errors')) {
                    alert("Error en el registro: " + data.errors.map(error => error.message).join(", "));
                } else {
                    alert("Hubo un inconveniente al procesar tu registro. Por favor, intenta de nuevo.");
                }
            });
        }
    }).catch(error => {
        alert("Error en la conexión de red. Por favor, verifica tu internet e intenta de nuevo.");
    }).finally(() => {
        // Restaurar estado original del botón
        if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = originalBtnText;
        }
    });
}

// Cerrar el modal de manera intuitiva si el usuario hace clic fuera de la caja del formulario
window.onclick = function(event) {
    const modal = document.getElementById('modal-postular');
    if (event.target === modal) {
        closeModal();
    }
}
